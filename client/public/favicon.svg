<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <style>
      .snowflake { 
        stroke: #4A90E2; 
        stroke-width: 6;
        stroke-linecap: round;
        fill: none;
      }
    </style>
  </defs>
  <!-- Simple elegant snowflake -->
  <g class="snowflake" transform="translate(50,50)">
    <!-- Center -->
    <circle cx="0" cy="0" r="3" fill="#4A90E2" />
    <!-- 6 main arms -->
    <line x1="0" y1="0" x2="0" y2="-35" />
    <line x1="0" y1="0" x2="30" y2="17" />
    <line x1="0" y1="0" x2="30" y2="-17" />
    <line x1="0" y1="0" x2="0" y2="35" />
    <line x1="0" y1="0" x2="-30" y2="-17" />
    <line x1="0" y1="0" x2="-30" y2="17" />
    <!-- Side branches on each arm -->
    <line x1="0" y1="-25" x2="-8" y2="-20" />
    <line x1="0" y1="-25" x2="8" y2="-20" />
    <line x1="25" y1="14" x2="20" y2="6" />
    <line x1="25" y1="14" x2="20" y2="22" />
    <line x1="25" y1="-14" x2="20" y2="-6" />
    <line x1="25" y1="-14" x2="20" y2="-22" />
    <line x1="0" y1="25" x2="-8" y2="20" />
    <line x1="0" y1="25" x2="8" y2="20" />
    <line x1="-25" y1="-14" x2="-20" y2="-6" />
    <line x1="-25" y1="-14" x2="-20" y2="-22" />
    <line x1="-25" y1="14" x2="-20" y2="6" />
    <line x1="-25" y1="14" x2="-20" y2="22" />
  </g>
</svg>
